syntax = "proto3";

package gedis;

service GedisKV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc BatchPut(BatchPutRequest) returns (BatchPutResponse);
}

message GetRequest {string  key = 1;}
message GetResponse {bytes value = 1; bool found = 2; string error = 3;}

message PutRequest {string key = 1; bytes  value = 2;}
message PutResponse {bool ok = 1; string error = 2;}

message DeleteRequest {string  key = 1; bytes value = 2;}
message DeleteResponse {bool ok = 1; string  error = 2;}

message KVPair {string key = 1; bytes value = 2;}
message BatchPutRequest{repeated KVPair pairs = 1;}
message BatchPutResponse {bool ok = 1;}